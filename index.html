<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Calculator</title>
  </head>
  <body>
    <main class="calculator">
      <div class="calculator__header">
        <button
          class="calculator__theme-toggle"
          id="theme-toggle"
          type="button"
          aria-label="Switch to dark mode"
          aria-pressed="false"
        >
          <span class="calculator__theme-icon" aria-hidden="true">☾</span>
        </button>
      </div>

      <section class="calculator__display" aria-label="Calculator display">
        <output
          class="calculator__result"
          id="calculator-display"
          aria-live="polite"
        >
          0
        </output>
      </section>
      <section class="calculator__keypad" aria-label="Calculator keypad">
        <button
          class="calculator__key calculator__key--function"
          type="button"
          data-action="clear"
          aria-label="Clear calculator"
        >
          AC
        </button>
        <button
          class="calculator__key calculator__key--function"
          type="button"
          data-action="delete"
          aria-label="Delete last digit"
        >
          DEL
        </button>
        <button
          class="calculator__key calculator__key--function"
          type="button"
          data-action="percentage"
          aria-label="Percentage"
        >
          %
        </button>
        <button
          class="calculator__key calculator__key--operator"
          type="button"
          data-operator="/"
          aria-label="Divide"
        >
          ÷
        </button>
        <button class="calculator__key" type="button" data-number="7">7</button>
        <button class="calculator__key" type="button" data-number="8">8</button>
        <button class="calculator__key" type="button" data-number="9">9</button>
        <button
          class="calculator__key calculator__key--operator"
          type="button"
          data-operator="*"
          aria-label="Multiply"
        >
          ×
        </button>
        <button class="calculator__key" type="button" data-number="4">4</button>
        <button class="calculator__key" type="button" data-number="5">5</button>
        <button class="calculator__key" type="button" data-number="6">6</button>
        <button
          class="calculator__key calculator__key--operator"
          type="button"
          data-operator="-"
          aria-label="Subtract"
        >
          −
        </button>
        <button class="calculator__key" type="button" data-number="1">1</button>
        <button class="calculator__key" type="button" data-number="2">2</button>
        <button class="calculator__key" type="button" data-number="3">3</button>
        <button
          class="calculator__key calculator__key--operator"
          type="button"
          data-operator="+"
          aria-label="Add"
        >
          +
        </button>
        <button
          class="calculator__key calculator__key--zero"
          type="button"
          data-number="0"
        >
          0
        </button>
        <button
          class="calculator__key"
          type="button"
          data-number="."
          aria-label="Decimal point"
        >
          .
        </button>
        <button
          class="calculator__key calculator__key--equals"
          type="button"
          data-action="calculate"
          aria-label="Equals"
        >
          =
        </button>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
